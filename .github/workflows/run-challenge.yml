name: Run Replication Challenge

# This workflow runs scripts/run_challenge.sh on a GitHub-hosted Ubuntu runner
# (which has Docker and docker compose preinstalled) and uploads the captured
# output as a build artifact. It can be used to capture verification evidence
# without needing Docker on a local machine.

on:
  workflow_dispatch:
  push:
    branches: [enhanced-mm2]
    paths:
      - 'scripts/run_challenge.sh'
      - 'docker-compose.yml'
      - 'docker/**'
      - '.github/workflows/run-challenge.yml'

jobs:
  run-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Pre-pull base Kafka image
        run: docker pull apache/kafka:4.0.0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build enhanced MirrorMaker 2 jar
        run: ./gradlew :connect:mirror:jar -x test --no-daemon

      - name: Merge enhanced MM2 classes into original connect-mirror JAR
        run: |
          # Extract original JAR from the Kafka image
          CONTAINER=$(docker create apache/kafka:4.0.0)
          ORIGINAL_JAR=$(docker exec "$CONTAINER" find /opt/kafka/libs -name 'connect-mirror-*.jar' -not -name '*test*' -not -name '*sources*' | head -1 | tr -d '\r')
          docker cp "$CONTAINER:$ORIGINAL_JAR" /tmp/original-connect-mirror.jar
          docker rm "$CONTAINER"
          echo "Original JAR: $(stat -c%s /tmp/original-connect-mirror.jar) bytes"

          # Extract enhanced classes
          ENHANCED_JAR=$(ls connect/mirror/build/libs/connect-mirror-*.jar | head -1)
          mkdir -p /tmp/merge-classes
          cd /tmp/merge-classes
          jar xf "$GITHUB_WORKSPACE/$ENHANCED_JAR"
          echo "Enhanced classes: $(find . -name '*.class' | wc -l)"

          # Update original JAR with enhanced classes
          jar uf /tmp/original-connect-mirror.jar .
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/merge-classes

          # Replace enhanced JAR with merged one
          rm -f "$ENHANCED_JAR"
          cp /tmp/original-connect-mirror.jar "$ENHANCED_JAR"
          rm -f /tmp/original-connect-mirror.jar
          echo "Merged JAR: $ENHANCED_JAR ($(stat -c%s "$ENHANCED_JAR") bytes)"

      - name: Build commit-log-producer image (tagged as pradeep23mishra/commit-log-producer:latest)
        run: |
          docker build \
            -f .github/Dockerfile.producer \
            -t pradeep23mishra/commit-log-producer:latest \
            .

      - name: Build enhanced-mm2 image (tagged as pradeep23mishra/enhanced-mm2:latest)
        run: |
          docker build \
            -f .github/Dockerfile.mm2 \
            -t pradeep23mishra/enhanced-mm2:latest \
            .

      - name: List built images
        run: docker image ls | grep -E 'pradeep23mishra|apache/kafka'

      - name: Run challenge script
        run: |
          set -o pipefail
          bash scripts/run_challenge.sh 2>&1 | tee run_challenge_output.log

      - name: Print final summary tail
        if: always()
        run: |
          echo "===== TAIL OF run_challenge_output.log ====="
          tail -n 200 run_challenge_output.log || true

      - name: Upload run output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-challenge-output
          path: run_challenge_output.log
          if-no-files-found: warn
