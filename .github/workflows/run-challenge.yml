name: Run Replication Challenge

# This workflow runs scripts/run_challenge.sh on a GitHub-hosted Ubuntu runner
# (which has Docker and docker compose preinstalled) and uploads the captured
# output as a build artifact. It can be used to capture verification evidence
# without needing Docker on a local machine.

on:
  workflow_dispatch:
  push:
    branches: [enhanced-mm2, pr-1]
    paths:
      - 'scripts/run_challenge.sh'
      - 'docker-compose.yml'
      - 'docker/**'
      - '.github/workflows/run-challenge.yml'
      - '.github/Dockerfile.mm2'
      - '.github/Dockerfile.producer'
      - 'connect/mirror/src/**'
      - 'README.md'

jobs:
  run-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Pre-pull base Kafka image
        run: docker pull apache/kafka:4.0.0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compile enhanced classes against Kafka 4.0.0 APIs
        run: |
          # Extract 4.0.0 JARs from the Kafka image for the compile classpath
          CONTAINER=$(docker create apache/kafka:4.0.0)
          mkdir -p /tmp/kafka-libs
          docker cp "$CONTAINER:/opt/kafka/libs/." /tmp/kafka-libs/
          docker rm "$CONTAINER"

          # Find the original connect-mirror JAR (we'll merge our classes into it)
          ORIGINAL_JAR=$(ls /tmp/kafka-libs/connect-mirror-4*.jar | head -1)
          echo "Original JAR: $ORIGINAL_JAR ($(stat -c%s "$ORIGINAL_JAR") bytes)"

          # Build classpath from all 4.0.0 JARs
          CP=$(echo /tmp/kafka-libs/*.jar | tr ' ' ':')
          echo "Classpath has $(echo $CP | tr ':' '\n' | wc -l) JARs"

          # Compile our enhanced classes against 4.0.0 APIs
          mkdir -p /tmp/enhanced-classes
          javac -d /tmp/enhanced-classes -cp "$CP" \
            -sourcepath connect/mirror/src/main/java \
            connect/mirror/src/main/java/org/apache/kafka/connect/mirror/TruncationDetector.java \
            connect/mirror/src/main/java/org/apache/kafka/connect/mirror/TopicResetHandler.java \
            connect/mirror/src/main/java/org/apache/kafka/connect/mirror/LogTruncationException.java \
            .github/EnhancedMirrorSourceTask.java

          echo "Compiled classes:"
          find /tmp/enhanced-classes -name '*.class' | sort

          # Merge compiled classes into the original connect-mirror JAR
          cp "$ORIGINAL_JAR" /tmp/merged-connect-mirror.jar
          cd /tmp/enhanced-classes
          jar uf /tmp/merged-connect-mirror.jar .
          cd "$GITHUB_WORKSPACE"

          # Place merged JAR where the Dockerfile expects it
          mkdir -p connect/mirror/build/libs
          cp /tmp/merged-connect-mirror.jar connect/mirror/build/libs/
          echo "Merged JAR: $(stat -c%s connect/mirror/build/libs/*.jar) bytes"

          # Clean up
          rm -rf /tmp/kafka-libs /tmp/enhanced-classes /tmp/merged-connect-mirror.jar

      - name: Build commit-log-producer image (tagged as pradeep23mishra/commit-log-producer:latest)
        run: |
          docker build \
            -f .github/Dockerfile.producer \
            -t pradeep23mishra/commit-log-producer:latest \
            .

      - name: Build enhanced-mm2 image (tagged as pradeep23mishra/enhanced-mm2:latest)
        run: |
          docker build \
            -f .github/Dockerfile.mm2 \
            -t pradeep23mishra/enhanced-mm2:latest \
            .

      - name: List built images
        run: docker image ls | grep -E 'pradeep23mishra|apache/kafka'

      - name: Run challenge script
        run: |
          set -o pipefail
          bash scripts/run_challenge.sh 2>&1 | tee run_challenge_output.log

      - name: Print final summary tail
        if: always()
        run: |
          echo "===== TAIL OF run_challenge_output.log ====="
          tail -n 200 run_challenge_output.log || true

      - name: Upload run output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-challenge-output
          path: run_challenge_output.log
          if-no-files-found: warn
